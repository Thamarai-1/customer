
version: '3.8'

services:
  # ==============================================================================
  # Primary Database: MongoDB
  # ==============================================================================
  mongodb:
    image: mongo:7.0
    container_name: cea-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: customer_engagement_assistant
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cea-network

  # ==============================================================================
  # Distributed Cache & Rate Limiting: Redis
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: cea-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cea-network

  # ==============================================================================
  # Backend API: Node.js / Express / TypeScript
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cea-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/customer_engagement_assistant
      MONGODB_TIMEOUT_MS: 5000
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: 5000
      CORS_ORIGIN: '*'
      JWT_SECRET: ${JWT_SECRET:-replace_with_secure_secret_min_32_characters_long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - '5000:5000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cea-network

  # ==============================================================================
  # Frontend: Next.js App Router / React / Tailwind CSS
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cea-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://backend:5000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cea-network

  # ==============================================================================
  # Reverse Proxy & Gateway: Nginx
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: cea-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/nginx-health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cea-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  cea-network:
    driver: bridge
